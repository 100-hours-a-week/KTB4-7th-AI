[project]
name = "maemmae-ai"
version = "0.1.0"
description = "맴매 AI 서버 — 매출 예측 · 솔루션 생성 · 챗봇"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=2.0",
    "holidays>=0.58",
    "anthropic>=0.40",
    "openai>=1.108",  # chat.completions.create의 reasoning_effort 파라미터 정식 지원 버전
    "google-genai>=1.0",
    "langgraph>=0.2.50",
    "langchain-anthropic>=0.3",
    "langchain-openai>=1.4.1",
    "langchain-google-genai>=4.0",
    "httpx>=0.27",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "openpyxl>=3.1",  # devtools/forecast_check.py 의 POS 엑셀 파싱
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
