name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
        env:
          INTERNAL_API_KEY: test-key

  docker:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ai:${{ github.sha }} .
      - name: 컨테이너 기동 확인
        run: |
          docker run -d --name ai -p 8000:8000 -e INTERNAL_API_KEY=ci ai:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -sf localhost:8000/health && exit 0
            sleep 2
          done
          docker logs ai
          exit 1
      # ECR push 는 클라우드 팀이 리포지토리 이름과 인증 방식(OIDC role vs access key)을
      # 확정한 뒤 추가한다. 이미지 태그는 위키 CI 설계대로 full commit SHA 를 쓴다.
